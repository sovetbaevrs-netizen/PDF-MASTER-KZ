name: Build PDF MASTER KZ Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "PDF_MASTER_KZ.py"
      - "requirements.txt"
      - "PDF_MASTER_KZ.ico"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify Python source syntax
        run: python -m py_compile PDF_MASTER_KZ.py

      - name: Build portable EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDF_MASTER_KZ --icon PDF_MASTER_KZ.ico --collect-all pymupdf --hidden-import PIL.ImageTk PDF_MASTER_KZ.py

      - name: Check EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PDF_MASTER_KZ.exe")) { throw "Missing dist/PDF_MASTER_KZ.exe" }
          Get-Item "dist/PDF_MASTER_KZ.exe" | Select-Object Name, Length

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDF-MASTER-KZ-5.2-Windows
          path: dist/PDF_MASTER_KZ.exe
          if-no-files-found: error
          retention-days: 30
